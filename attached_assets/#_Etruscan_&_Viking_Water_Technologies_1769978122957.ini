### Invention 7: Watermill Technology

```markdown
### Viking Horizontal Watermill (Kvern)
**Rarity**: Uncommon | **Date**: 700 CE - Present

> Small-scale horizontal watermills that brought grain processing 
> to scattered Scandinavian settlements with limited water flow

**Category**: Water Power | **Scale**: Farm/Village

---

**How It Works**:

1. **Horizontal Wheel Design**
   - Water strikes paddles horizontally
   - No gears required
   - Direct drive to millstone above
   - Simple, efficient design

2. **Water Supply**
   - Small streams sufficient
   - Millpond storage common
   - Sluice gate control
   - Seasonal operation (some sites)

3. **Millstone Operation**
   - Upper stone rotates
   - Lower stone fixed
   - Grain fed through center
   - Flour collected at edges

4. **Adaptation to Terrain**
   - Fit steep Scandinavian streams
   - Small footprint
   - Individual farm scale
   - Mountain stream placement

**Technical Specifications**:
| Spec | Value |
|------|-------|
| Wheel Diameter | 0.5-1.5 meters |
| Paddle Number | 6-12 |
| Rotation Speed | 60-100 rpm |
| Output | 5-20 kg flour/hour |
| Power Source | Streams as small as 0.1 m³/s |
| Construction | Wood (all parts) |

**Comparison with Vertical Mills**:
| Feature | Horizontal (Viking) | Vertical (Roman) |
|---------|---------------------|------------------|
| Gear required | No | Yes |
| Water volume needed | Small | Large |
| Construction complexity | Simple | Complex |
| Output | Lower | Higher |
| Maintenance | Easy | Difficult |
| Best suited for | Mountain streams | Large rivers |

**Why It Mattered**:
• Brought milling to remote settlements
• Reduced labor of hand grinding
• Adapted to Scandinavian geography
• Individual farm ownership possible
• Still used in living tradition

**Distribution**:
| Region | Mills Documented |
|--------|------------------|
| Norway | Thousands (historical) |
| Faeroes | Essential for survival |
| Iceland | Adaptation with limited streams |
| Sweden | Common in mountain regions |
| Scotland/Ireland | Norse introduction |

**Archaeological Evidence**:
| Site | Date | Features |
|------|------|----------|
| Faeroes (multiple) | 900-1200 CE | Complete remains |
| Norway (many sites) | 800-1200 CE | Components, millstones |
| Orkney | 900-1100 CE | Norse period mills |
| Iceland | 900-1300 CE | Adapted designs |

**Legacy Today**:
→ Traditional mills still operate in Faeroes
→ Norwegian heritage mill preservation
→ Museum reconstructions
→ Traditional flour production (tourism)
→ Appropriate technology model

**Robert's Note**:
"Vikings solved a problem Roman engineering couldn't: 
how do you mill grain with a tiny mountain stream? 
The horizontal mill — no gears, simple construction, 
works with low water volumes. A single farmer could 
build and maintain one. It's so elegant that traditional 
mills still operate in the Faeroes, grinding grain the 
same way they did 1,000 years ago."

**Diagram Description**:
[Cross-section of horizontal mill: stream with sluice 
gate → water channel (millrace) → horizontal paddle 
wheel → vertical shaft → millstone chamber (upper 
stone rotating, lower fixed) → flour collection. 
Inset: paddle wheel detail]
```

