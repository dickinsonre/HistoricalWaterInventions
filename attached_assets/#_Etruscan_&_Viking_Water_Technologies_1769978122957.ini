### Civilization Overview

```markdown
## Viking Civilization
**Era**: 793 CE - 1066 CE (Viking Age), roots to 500 BCE
**Region**: Scandinavia (Norway, Sweden, Denmark), expansion worldwide
**Climate Challenge**: Cold seas, fjords, ice, long winters, scattered settlements
**Inventions**: 7

> Masters of water in all its forms. Vikings didn't just cross oceans — 
